
name: Build HOME Client V0.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Mengambil source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan Java
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Menyiapkan Android SDK dan lisensi
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. Memeriksa Gradle Wrapper
      - name: Check Gradle Files
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: File gradlew tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: File settings.gradle tidak ditemukan!"
            exit 1
          fi

          chmod +x gradlew

      # 5. Cache Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Build APK
      - name: Build HOME Client APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug

      # 7. Periksa hasil APK
      - name: Check APK
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: APK tidak ditemukan!"
            find . -path "*/build/outputs/apk/*" -type f
            exit 1
          fi

      # 8. Upload APK
      - name: Upload HOME Client V0.1
        uses: actions/upload-artifact@v4
        with:
          name: HOME-Client-V0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
